name: Upload Python Package

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pypi-release
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Bump patch version
      id: bump
      run: |
        python - <<'EOF'
        import os, re, pathlib
        p = pathlib.Path('push_service/__init__.py')
        s = p.read_text(encoding='utf-8')
        m = re.search(r"__version__\s*=\s*(['\"])(\d+)\.(\d+)\.(\d+)\1", s)
        new = f"{m.group(2)}.{m.group(3)}.{int(m.group(4)) + 1}"
        p.write_text(s[:m.start()] + f"__version__ = '{new}'" + s[m.end():], encoding='utf-8')
        with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
            f.write(f"version={new}\n")
        EOF
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install setuptools wheel twine
        pip install -U packaging
    - name: Build and publish
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
      run: |
        python setup.py sdist bdist_wheel
        twine upload dist/*
    - name: Commit version bump and tag
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add push_service/__init__.py
        git commit -m "Bump version to ${{ steps.bump.outputs.version }} [skip ci]"
        git tag "v${{ steps.bump.outputs.version }}"
        git push origin HEAD:${{ github.ref_name }} --tags
